%YAML:1.0 # need to specify the file type at the top!

# ============================================================
# Blecaco 单目 VIO 估计器配置
#
# 改编自 OpenVINS 官方 euroc_mav 配置，并**逐项对齐**
# `/home/one/open_vins_mobile/app_device/config/estimator_config.yaml`
# —— 那份配置是本项目在真机上实测跑通（能初始化、能出轨迹）的金标准。
#
# ⚠️ 曾经踩过的坑：up_*_chi2_multipler 原来写成 1（金标准是 5）、
#    up_*_sigma_px 写成 1（金标准是 2）。这两个值会让视觉更新的卡方门限
#    过严 → 更新被大量拒绝 → 滤波器退化为纯 IMU 递推 → 静止时位置指数发散。
#
# 配套文件：kalibr_imu_chain.yaml / kalibr_imucam_chain.yaml（同目录）
# ============================================================

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1 # 1 = mono

# ---- 在线标定：这是「免逐机标定」的关键开关 ----
calib_cam_extrinsics: true   # 在线优化相机-IMU外参 R_ItoC, p_CinI
calib_cam_intrinsics: true   # 在线优化相机内参(焦距/中心/畸变)
calib_cam_timeoffset: true   # 在线优化相机-IMU时间偏移
calib_imu_intrinsics: false  # IMU内参(旋转+skew-scale)
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update（金标准值；try_zupt=false 时本来不生效）
try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 1.5
zupt_only_at_beginning: true

# ==================================================================
# 初始化：静态初始化（手机举稳）
#
# 这几个阈值必须**够严**：太松的话会在「手还在动」时误判为静止而完成初始化，
# 初始化的姿态/速度就是错的，后面必然发散。
# ==================================================================

init_window_time: 1.0      # 收集初始化信息所需秒数（静止）
init_imu_thresh: 0.4       # 加计方差阈值（检测"抖动"），越小越严
init_max_disparity: 2.0    # 判定平台静止的最大视差，越小越严
init_max_features: 25

init_dyn_use: false        # 用静态初始化，不用动态（无需晃动手机）
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

# ==================================================================
# 记录（一般关闭）
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# 前端特征跟踪
# ==================================================================

use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 31.0      # 与相机 ~30fps 匹配（金标准值）
downsample_cameras: false
num_opencv_threads: 1      # 手机上单线程反而更快/更少抢占（金标准值）
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# 观测噪声与卡方门限
#
# ⚠️⚠️ 这一组是「静止时位置指数发散」的直接原因：
#   chi2_multipler 决定残差门限的宽窄，**值越大越宽松**。
#   原来写成 1（比金标准紧 5 倍）、sigma_px 写成 1（残差被归一化得更大），
#   两者叠加会让几乎所有视觉更新被拒绝 → 退化成纯 IMU 递推 → 发散。
# ==================================================================

up_msckf_sigma_px: 2
up_msckf_chi2_multipler: 5
up_slam_sigma_px: 2
up_slam_chi2_multipler: 5
up_aruco_sigma_px: 2
up_aruco_chi2_multipler: 5

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
